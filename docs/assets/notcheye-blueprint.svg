<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 320" width="100%" height="100%">
  <defs>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#30D158" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#30D158" flood-opacity="0.4"/>
    </filter>
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#FF3B30" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="4" stdDeviation="14" flood-color="#FF3B30" flood-opacity="0.45"/>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="940" height="320" rx="16" fill="#060709"/>
  <rect width="940" height="320" rx="16" fill="url(#grid)"/>
  <rect width="940" height="320" rx="16" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Left: State A (Normal Laser Green) -->
  <g transform="translate(40, 30)">
    <text x="0" y="20" fill="#30D158" font-family="-apple-system, SF Pro Display, sans-serif" font-size="12" font-weight="700" letter-spacing="1">STATE A: AUTHORIZED CAMERA STREAM (#30D158)</text>
    <text x="0" y="38" fill="#8B949E" font-family="-apple-system, SF Pro Text, sans-serif" font-size="11">Transient 310×54pt dynamic capsule with continuous squircle drop</text>

    <!-- Bezel & Menu bar mockup -->
    <rect x="0" y="55" width="410" height="190" rx="10" fill="#0E1117" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <rect x="0" y="55" width="410" height="28" fill="#121620" opacity="0.95"/>
    <line x1="0" y1="83" x2="410" y2="83" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="14" y="73" fill="#A1A1A6" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Finder</text>
    <text x="56" y="73" fill="#6E7681" font-family="-apple-system, sans-serif" font-size="11">File  Edit  View</text>
    <text x="350" y="73" fill="#6E7681" font-family="monospace" font-size="10">9:41 AM</text>

    <!-- Notch & Green Dropdown -->
    <g transform="translate(50, 55)">
      <!-- 310x54 Capsule -->
      <path d="M 0 0 H 310 V 36 C 310 45.94 301.94 54 292 54 H 18 C 8.06 54 0 45.94 0 36 Z" fill="#000000" stroke="#30D158" stroke-width="1.5" filter="url(#glow-green)"/>
      <!-- Dot & Pulse -->
      <circle cx="24" cy="27" r="4.5" fill="#30D158"/>
      <!-- Text -->
      <text x="38" y="24" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Camera Active</text>
      <text x="38" y="40" fill="#8B949E" font-family="monospace" font-size="10">FaceTime HD • Native App</text>
      <!-- LIVE Badge -->
      <rect x="250" y="18" width="42" height="18" rx="5" fill="rgba(48, 209, 88, 0.15)" stroke="rgba(48, 209, 88, 0.4)" stroke-width="0.8"/>
      <text x="271" y="31" fill="#30D158" font-family="monospace" font-size="9" font-weight="800" text-anchor="middle">LIVE</text>
    </g>

    <!-- Persistent Halo Callout -->
    <text x="205" y="215" fill="#30D158" font-family="monospace" font-size="10" text-anchor="middle">Retracts to 185pt halo after 3.5s (0% occlusion)</text>
  </g>

  <!-- Right: State B (Citrix Redirection Alert Ruby) -->
  <g transform="translate(490, 30)">
    <text x="0" y="20" fill="#FF3B30" font-family="-apple-system, SF Pro Display, sans-serif" font-size="12" font-weight="700" letter-spacing="1">STATE B: CITRIX HDX REDIRECTION (#FF3B30)</text>
    <text x="0" y="38" fill="#8B949E" font-family="-apple-system, SF Pro Text, sans-serif" font-size="11">High-visibility unmissable alert for virtual machine camera streaming</text>

    <!-- Bezel & Menu bar mockup -->
    <rect x="0" y="55" width="410" height="190" rx="10" fill="#0E1117" stroke="rgba(255,59,48,0.25)" stroke-width="1"/>
    <rect x="0" y="55" width="410" height="28" fill="#1A1012" opacity="0.95"/>
    <line x1="0" y1="83" x2="410" y2="83" stroke="rgba(255,59,48,0.15)" stroke-width="1"/>
    <text x="14" y="73" fill="#FF3B30" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Citrix Viewer</text>
    <text x="96" y="73" fill="#6E7681" font-family="-apple-system, sans-serif" font-size="11">Windows 11 VM Session</text>
    <text x="315" y="73" fill="#FF3B30" font-family="monospace" font-size="10">HDX TUNNEL</text>

    <!-- Notch & Red Dropdown -->
    <g transform="translate(50, 55)">
      <!-- 310x54 Capsule -->
      <path d="M 0 0 H 310 V 36 C 310 45.94 301.94 54 292 54 H 18 C 8.06 54 0 45.94 0 36 Z" fill="#000000" stroke="#FF3B30" stroke-width="1.8" filter="url(#glow-red)"/>
      <!-- Dot & Pulse -->
      <circle cx="24" cy="27" r="4.5" fill="#FF3B30"/>
      <!-- Text -->
      <text x="38" y="24" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Citrix HDX Pipe</text>
      <text x="38" y="40" fill="#FF3B30" font-family="monospace" font-size="10" opacity="0.85">corp-gateway • VM In Use</text>
      <!-- TUNNEL Badge -->
      <rect x="238" y="18" width="56" height="18" rx="5" fill="rgba(255, 59, 48, 0.18)" stroke="rgba(255, 59, 48, 0.5)" stroke-width="0.8"/>
      <text x="266" y="31" fill="#FF3B30" font-family="monospace" font-size="9" font-weight="800" text-anchor="middle">ALERT</text>
    </g>

    <!-- Persistent Halo Callout -->
    <text x="205" y="215" fill="#FF3B30" font-family="monospace" font-size="10" text-anchor="middle">Floats over Citrix fullscreen at CGShieldingLevel+1</text>
  </g>
</svg>
